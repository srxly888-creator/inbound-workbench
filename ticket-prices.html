*{box-sizing:border-box}

header{background:linear-gradient(135deg,var(--brand),#f07ba6);color:#fff;padding:18px 20px 14px}

header .sub{opacity:.92;font-size:12.5px;margin-top:4px}
.wrap{max-width:1080px;margin:0 auto;padding:14px 14px 60px}
.disclaimer{background:#fff5fa;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:10px 14px;margin:14px 0;font-size:12.5px;color:#7a4a63}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;flex:1;min-width:120px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--brand)}
.stat span{font-size:12px;color:var(--sub)}
.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 6px}
.mktbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.mk{padding:5px 12px;border:1px solid var(--line);background:#fff;border-radius:20px;cursor:pointer;font-size:12.5px;color:var(--sub)}
.mk.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;outline:none}
.search:focus{border-color:var(--brand)}
.opt{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden;box-shadow:0 2px 8px rgba(230,73,128,.05)}
.card .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line)}
.card .hd .l{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .hd .mkt{background:#ffe3ef;color:var(--brand-d);font-size:11px;padding:2px 8px;border-radius:10px}
.card .hd .nm{font-weight:700;font-size:15px}
.card .hd .dy{font-size:12px;color:var(--sub)}
.card .hd .tot{text-align:right}
.card .hd .tot b{color:var(--brand);font-size:17px}
.card .hd .tot span{display:block;font-size:11px;color:var(--sub)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;font-size:12.5px;border-bottom:1px solid #f6eaf1}
th{color:var(--sub);font-weight:600;background:#fdf7fb;font-size:11.5px}
td .note{color:var(--sub);font-size:11px;line-height:1.4}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}
.b-门票{background:#ffe3ef;color:var(--brand-d)}
.b-免费{background:#e3f6ec;color:var(--green)}
.b-体验{background:#e6f0fa;color:var(--blue)}
.b-待核{background:#f0f0f0;color:var(--gray)}
.price{font-weight:700;color:var(--ink)}
.price.free{color:var(--green);font-weight:600}
.src{color:#bbb;font-size:10.5px}
.empty{text-align:center;color:var(--sub);padding:30px}
footer{text-align:center;color:var(--sub);font-size:11.5px;padding:20px}
</style>

/* 个别别名/补充条目（保证能命中 T） */
T["两江游船"]=["体验",100,"-","重庆两江游船约80-150","重庆文旅"];
T["鹭江夜游"]=["体验",130,"-","厦门鹭江夜游船票约100-150","厦门文旅"];
T["南强街"]=["免费","免费","-","免费（昆明街区）","昆明"];
T["回民街"]=["免费","免费","-","免费（西安街区）","西安"];

var curMkt="全部";
function num(v){return (typeof v==="number")?v:0;}
function routeSum(r){var s=0;r.spots.forEach(function(sp){var t=T[sp];if(t&&t[0]==="门票")s+=num(t[1]);});return s;}
function badge(t){var m={"门票":"b-门票","免费":"b-免费","体验":"b-体验","待核":"b-待核"};return '<span class="badge '+(m[t]||"b-待核")+'">'+t+'</span>';}
function priceCell(t){
  if(t[0]==="免费")return '<span class="price free">免费</span>';
  var p=(typeof t[1]==="number")?("¥"+t[1]):t[1];
  var l=(t[2]&&t[2]!=="-"&&t[2]!=="免费")?("/ 淡 "+t[2]):"";
  return '<span class="price">'+p+'</span><span class="src"> '+l+'</span>';
}
function render(){
  var list=document.getElementById("list");
  var q=document.getElementById("search").value.trim();
  var onlypay=document.getElementById("onlypay").checked;
  var html="";
  var shown=0;
  R.forEach(function(r){
    if(curMkt!=="全部"&&r.mkt!==curMkt)return;
    if(q){
      var hit=r.name.indexOf(q)>=0 || r.spots.some(function(s){return s.indexOf(q)>=0;});
      if(!hit)return;
    }
    var rows="";
    r.spots.forEach(function(sp){
      var t=T[sp];
      if(onlypay&&t&&t[0]!=="门票")return;
      if(!t){t=["待核","-","-","未收录，请现场核实",""];
        rows+='<tr><td>'+sp+'</td><td>'+badge("待核")+'</td><td colspan="2"><span class="src">未收录</span></td><td class="note">请现场核实</td></tr>';
        return;}
      rows+='<tr><td>'+sp+'</td><td>'+badge(t[0])+'</td><td>'+priceCell(t)+'</td><td class="src">'+(t[4]||"")+'</td><td class="note">'+t[3]+'</td></tr>';
    });
    if(onlypay&&rows==="")return;
    var sum=routeSum(r);
    var payCnt=r.spots.filter(function(s){return T[s]&&T[s][0]==="门票";}).length;
    var freeCnt=r.spots.filter(function(s){return T[s]&&T[s][0]==="免费";}).length;
    html+='<div class="card"><div class="hd"><div class="l"><span class="mkt">'+r.mkt+'</span><span class="nm">'+r.name+'</span><span class="dy">'+r.d+'天</span></div>'+
      '<div class="tot"><b>¥'+sum+'</b><span>挂牌门票合计(旺) · '+payCnt+'收费/'+freeCnt+'免费</span></div></div>'+
      '<table><thead><tr><th>景区</th><th>类型</th><th>挂牌价</th><th>来源</th><th>备注(索道/景交/游船另计)</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    shown++;
  });
  if(shown===0)html='<div class="empty">没有匹配的线路，换个关键词试试～</div>';
  list.innerHTML=html;
}
function buildMkt(){
  var bar=document.getElementById("mktbar");
  var mkts=["全部"];R.forEach(function(r){if(mkts.indexOf(r.mkt)<0)mkts.push(r.mkt);});
  bar.innerHTML=mkts.map(function(m){return '<span class="mk'+(m===curMkt?" on":"")+'" data-m="'+m+'">'+m+'</span>';}).join("");
  bar.querySelectorAll(".mk").forEach(function(el){el.onclick=function(){curMkt=el.getAttribute("data-m");buildMkt();render();};});
}
function buildStats(){
  var spots=new Set();var free=0,pay=0,exp=0;
  R.forEach(function(r){r.spots.forEach(function(s){if(T[s]){if(!spots.has(s)){spots.add(s);var t=T[s][0];if(t==="免费")free++;else if(t==="体验")exp++;else if(t==="门票")pay++;}}});});
  document.getElementById("stats").innerHTML=
    '<div class="stat"><b>'+R.length+'</b><span>国内线路</span></div>'+
    '<div class="stat"><b>'+spots.size+'</b><span>收录景区</span></div>'+
    '<div class="stat"><b style="color:var(--brand-d)">'+pay+'</b><span>收费门票</span></div>'+
    '<div class="stat"><b style="color:var(--green)">'+free+'</b><span>免费开放</span></div>'+
    '<div class="stat"><b style="color:var(--blue)">'+exp+'</b><span>游船/演出</span></div>';
}
buildStats();buildMkt();render();
document.getElementById("search").addEventListener("input",render);
document.getElementById("onlypay").addEventListener("change",render);
</script>
