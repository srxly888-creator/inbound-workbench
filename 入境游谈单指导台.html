<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>入境游谈单指导台 · 客服谈单 & 全周期维护</title>
<style>
:root{
  --brand:#e64980; --brand-2:#d6336c; --brand-soft:#fce4ef; --brand-line:#f7c9dd;
  --bg:#fdf4f8; --card:#ffffff; --ink:#2b2330; --ink-2:#6b6470; --ink-3:#9a93a0;
  --ok:#2f9e44; --ok-soft:#e6f4ea; --warn:#e8590c; --warn-soft:#fff1e6;
  --line:#f0e3ea; --shadow:0 6px 24px rgba(214,51,108,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:48px}
a{color:var(--brand);text-decoration:none}
header{background:linear-gradient(135deg,#fff 0%,var(--brand-soft) 100%);
  border-bottom:1px solid var(--brand-line);padding:22px 24px 18px}
.h-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.h-logo{font-size:30px}
h1{font-size:21px;color:var(--brand-2);letter-spacing:.5px}
.h-sub{color:var(--ink-2);font-size:13px;margin-top:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.search{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.search input{flex:1;min-width:240px;border:1.5px solid var(--brand-line);border-radius:12px;
  padding:12px 16px;font-size:15px;background:#fff;color:var(--ink);outline:none}
.search input:focus{border-color:var(--brand)}
.search .cnt{display:flex;align-items:center;font-size:13px;color:var(--ink-2);
  background:#fff;border:1.5px solid var(--brand-line);border-radius:12px;padding:0 14px;white-space:nowrap}
.tabs{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tab{background:#fff;border:1.5px solid var(--brand-line);color:var(--ink-2);
  padding:9px 16px;border-radius:999px;font-size:14px;cursor:pointer;transition:.15s;font-weight:600}
.tab:hover{border-color:var(--brand)}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.sec-title{font-size:16px;color:var(--brand-2);font-weight:800;margin:26px 0 12px;
  display:flex;align-items:center;gap:8px}
.sec-title small{font-weight:500;color:var(--ink-3);font-size:12px}
/* stage stepper */
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.step{flex:1;min-width:150px;background:#fff;border:1.5px solid var(--line);border-radius:14px;
  padding:14px;cursor:pointer;transition:.15s;position:relative}
.step:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.step.on{border-color:var(--brand);background:var(--brand-soft)}
.step .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--brand);
  color:#fff;align-items:center;justify-content:center;font-size:13px;font-weight:800;margin-right:8px}
.step h3{font-size:14px;display:inline;color:var(--ink)}
.step p{font-size:12px;color:var(--ink-3);margin-top:8px}
/* stage detail */
.detail{background:#fff;border:1.5px solid var(--brand-line);border-radius:16px;
  padding:18px 20px;margin-top:14px;box-shadow:var(--shadow)}
.block{margin-bottom:18px}
.block:last-child{margin-bottom:0}
.block h4{font-size:14px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.b-adv{border-left:4px solid var(--ok);background:var(--ok-soft);padding:10px 14px;border-radius:0 10px 10px 0}
.b-cau{border-left:4px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 10px 10px 0}
ul.tips{list-style:none}
ul.tips li{position:relative;padding:6px 0 6px 22px;font-size:13.5px;color:var(--ink)}
ul.tips li:before{content:"›";position:absolute;left:4px;color:var(--brand);font-weight:800;font-size:16px;top:4px}
.b-adv ul.tips li:before{color:var(--ok)}
.b-cau ul.tips li:before{color:var(--warn)}
/* script cards */
.script{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.script .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.cmd{background:var(--brand-soft);color:var(--brand-2);font-family:ui-monospace,Menlo,monospace;
  font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px}
.script .t{font-weight:700;font-size:14px}
.star{color:#f59f00;font-size:13px;font-weight:700}
.copy{border:1.5px solid var(--brand-line);background:#fff;color:var(--brand-2);
  border-radius:8px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer;margin-left:auto}
.copy:hover{background:var(--brand-soft)}
.copy.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.script pre{background:#2b2330;color:#f5f0f3;padding:12px 14px;border-radius:10px;
  font-size:12.5px;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,monospace;line-height:1.55}
.script .note{font-size:12px;color:var(--ink-2);margin-top:7px;padding-left:2px}
/* follow-up timeline */
.timeline{display:flex;gap:0;align-items:stretch;margin:6px 0 4px;flex-wrap:wrap}
.tl-node{flex:1;min-width:120px;background:var(--brand-soft);border:1px solid var(--brand-line);
  border-radius:10px;padding:10px 12px;margin:4px;position:relative}
.tl-node b{color:var(--brand-2);font-size:13px}
.tl-node span{display:block;font-size:12px;color:var(--ink-2);margin-top:3px}
/* country grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-top:8px}
.ctry{background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:14px 16px;
  box-shadow:var(--shadow);transition:.15s}
.ctry:hover{border-color:var(--brand)}
.ctry .ch{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ctry .fl{font-size:26px}
.ctry .nm{font-size:16px;font-weight:800}
.ctry .en{font-size:12px;color:var(--ink-3);font-weight:600}
.ctry .rg{margin-left:auto;font-size:11px;background:var(--brand-soft);color:var(--brand-2);
  padding:3px 9px;border-radius:999px;font-weight:700}
.dim{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;margin-top:4px}
.dim dt{color:var(--brand-2);font-weight:700;white-space:nowrap}
.dim dd{color:var(--ink);margin:0}
.ctry .taboo{display:inline-block;margin-top:11px;font-size:12px;font-weight:700;
  background:var(--brand-soft);color:var(--brand-2);padding:5px 12px;border-radius:8px}
/* country tips inside stage */
.ctip{background:var(--brand-soft);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink)}
.ctip b{color:var(--brand-2)}
.empty{text-align:center;color:var(--ink-3);padding:40px;font-size:14px}
footer{text-align:center;color:var(--ink-3);font-size:12px;margin-top:34px;padding:0 20px}
footer b{color:var(--brand-2)}
@media print{
  header{box-shadow:none}
  .search,.tabs,.copy,.tab{display:none}
  .card,.ctry,.detail{box-shadow:none;break-inside:avoid}
  body{background:#fff}
}
</style>
</head>
<body>
<header>
  <div class="wrap">

      </div>

</header>

const ENNAME={US:"united states america",UK:"united kingdom britain",CA:"canada",AU:"australia",NZ:"new zealand",DE:"germany",FR:"france",ES:"spain",IT:"italy",SE:"sweden",JP:"japan",KR:"korea",SG:"singapore",MY:"malaysia",TH:"thailand",ID:"indonesia",AE:"united arab emirates emirates",SA:"saudi arabia",QA:"qatar",IL:"israel",IN:"india",RU:"russia",BR:"brazil",MX:"mexico",ZA:"south africa",AR:"argentina"};

/* ============ 状态 & 渲染 ============ */
let mode="stage";
let curStage="s1";
let q="";

function onSearch(){ q=document.getElementById("q").value.trim(); render(); }
function setMode(m){ mode=m;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.m===m));
  document.getElementById("stageView").style.display=m==="stage"?"block":"none";
  document.getElementById("countryView").style.display=m==="country"?"block":"none";
  document.getElementById("scriptView").style.display=m==="script"?"block":"none";
  render();
}

function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function matchStage(st){
  if(!q) return true;
  const hay=(st.zh+st.sum+st.advice.join("")+st.cautions.join("")+st.countryTips+st.scripts.map(k=>SCRIPTS[k].title+SCRIPTS[k].text).join("")).toLowerCase();
  return hay.includes(q.toLowerCase());
}
function matchCountry(c){
  if(!q) return true;
  const d=COUNTRIES[c];
  const hay=(c+" "+d.zh+" "+d.region+" "+d.abbr.join(" ")+" "+(ENNAME[c]||"")+d.visa+d.pay+d.diet+d.comm+d.comms+d.trust+d.crowd).toLowerCase();
  return hay.includes(q.toLowerCase());
}
function matchScript(k){
  if(!q) return true;
  const s=SCRIPTS[k];
  return (s.cmd+" "+s.title+" "+s.text+" "+s.note).toLowerCase().includes(q.toLowerCase());
}

function render(){
  if(mode==="stage") renderStage();
  else if(mode==="country") renderCountry();
  else renderScript();
}

function renderStage(){
  const view=document.getElementById("stageView");
  const list=STAGES.filter(matchStage);
  let html='<div class="sec-title">① 谈单阶段指导 <small>从「刚加好友」到「成交售后」五步闭环 · 点阶段卡看详情</small></div>';
  html+='<div class="stepper">';
  list.forEach(st=>{
    html+=`<div class="step ${st.id===curStage&&!q?'on':''}" onclick="openStage('${st.id}')">
      <span class="n">${st.n}</span><h3>${st.icon} ${st.zh}</h3>
      <p>${st.sum}</p></div>`;
  });
  html+='</div>';
  if(q){ // 搜索态：直接列出所有命中阶段的详情
    if(list.length===0) html+='<div class="empty">没有匹配「'+esc(q)+'」的阶段，换关键词试试。</div>';
    list.forEach(st=>html+=stageDetail(st));
  } else {
    html+=stageDetail(STAGES.find(s=>s.id===curStage)||STAGES[0]);
  }
  view.innerHTML=html;
  document.getElementById("cntPill").textContent=list.length+" 个阶段";
}
function openStage(id){ curStage=id; if(q){q="";document.getElementById("q").value="";} render(); }

function stageDetail(st){
  let h=`<div class="detail">
    <div class="block"><h4>💡 谈单建议</h4><div class="b-adv"><ul class="tips">`;
  st.advice.forEach(a=>h+=`<li>${esc(a)}</li>`);
  h+=`</ul></div></div>`;
  h+=`<div class="block"><h4>⚠️ 客服注意</h4><div class="b-cau"><ul class="tips">`;
  st.cautions.forEach(c=>h+=`<li>${esc(c)}</li>`);
  h+=`</ul></div></div>`;
  if(st.id==="s4"){
    h+=`<div class="block"><h4>🔔 跟进节奏（报价后）</h4><div class="timeline">
      <div class="tl-node"><b>D1</b><span>轻触达：方案是否收到？可调</span></div>
      <div class="tl-node"><b>D3</b><span>档期紧张可锁一下，不施压</span></div>
      <div class="tl-node"><b>D7</b><span>不急，留门，低压力</span></div>
      <div class="tl-node"><b>&gt;14天</b><span>转沉睡，低频次月触达</span></div></div></div>`;
  }
  h+=`<div class="block"><h4>💬 配套话术</h4>`;
  st.scripts.forEach(k=>h+=scriptCard(k));
  h+=`</div>`;
  h+=`<div class="block"><h4>🌍 分国家差异提示</h4><div class="ctip">${esc(st.countryTips)}</div></div>`;
  h+=`</div>`;
  return h;
}

function scriptCard(k){
  const s=SCRIPTS[k];
  return `<div class="script">
    <div class="top"><span class="cmd">${esc(s.cmd)}</span><span class="t">${esc(s.title)}</span>
    ${s.star?'<span class="star">★ 标★口径问主管</span>':''}
    <button class="copy" onclick="copyScript(this,'${k}')">复制</button></div>
    <pre>${esc(s.text)}</pre>
    <div class="note">📌 ${esc(s.note)}</div></div>`;
}

function renderCountry(){
  const view=document.getElementById("countryView");
  const list=Object.keys(COUNTRIES).filter(matchCountry);
  let html='<div class="sec-title">② 分国家谈单注意 <small>7 维差异：签证分支 / 支付通道 / 饮食宗教 / 沟通风格 / 境内通讯 / 信任顾虑 / 人群结构 · 中英文/简写可搜</small></div>';
  html+='<div class="grid">';
  if(list.length===0) html+='<div class="empty">没有匹配「'+esc(q)+'」的国家，换关键词试试。</div>';
  list.forEach(c=>{
    const d=COUNTRIES[c];
    html+=`<div class="ctry"><div class="ch"><span class="fl">${d.fl}</span>
      <div><div class="nm">${d.zh}</div><div class="en">${c} · ${d.abbr.slice(0,2).join(" / ")}</div></div>
      <span class="rg">${d.region}</span></div>
      <dl class="dim">
        <dt>签证</dt><dd>${esc(d.visa)}</dd>
        <dt>支付</dt><dd>${esc(d.pay)}</dd>
        <dt>饮食宗教</dt><dd>${esc(d.diet)}</dd>
        <dt>沟通</dt><dd>${esc(d.comm)}</dd>
        <dt>境内通讯</dt><dd>${esc(d.comms)}</dd>
        <dt>信任</dt><dd>${esc(d.trust)}</dd>
        <dt>人群</dt><dd>${esc(d.crowd)}</dd>
      </dl>
      <a class="taboo" href="各国文化禁忌速查.html" target="_blank">🔗 看该国文化禁忌详情 →</a>
    </div>`;
  });
  html+='</div>';
  view.innerHTML=html;
  document.getElementById("cntPill").textContent=list.length+" 国";
}

function renderScript(){
  const view=document.getElementById("scriptView");
  const list=Object.keys(SCRIPTS).filter(matchScript);
  let html='<div class="sec-title">③ 话术模板库 <small>WhatsApp 快捷回复可直接复制 · 标 ★ 口径先问主管 · 发送前必改 [[占位符]]</small></div>';
  if(list.length===0) html+='<div class="empty">没有匹配「'+esc(q)+'」的话术，换关键词试试。</div>';
  list.forEach(k=>html+=scriptCard(k));
  view.innerHTML=html;
  document.getElementById("cntPill").textContent=list.length+" 条话术";
}

function copyScript(btn,k){
  const txt=SCRIPTS[k].text;
  navigator.clipboard.writeText(txt).then(()=>{
    btn.textContent="已复制 ✓"; btn.classList.add("done");
    setTimeout(()=>{btn.textContent="复制";btn.classList.remove("done");},1400);
  },()=>{ btn.textContent="复制失败"; });
}

render();
</script>
</body>
</html>
